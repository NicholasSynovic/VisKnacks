default_language_version:
    python: python3.14
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-ast
          - id: check-builtin-literals
          - id: check-case-conflict
          - id: check-executables-have-shebangs
          - id: check-illegal-windows-names
          - id: check-json
          - id: check-merge-conflict
          - id: check-shebang-scripts-are-executable
          - id: check-symlinks
          - id: check-toml
          - id: check-vcs-permalinks
          - id: check-xml
          - id: check-yaml
          - id: debug-statements
          - id: destroyed-symlinks
          #       - id: detect-aws-credentials    # Fails by default without a --credentials file
          - id: detect-private-key
          # - id: double-quote-string-fixer
          - id: end-of-file-fixer
          #       - id: file-contents-sorter  # Disabled as a sensible default
          #         files: []                 # Add files to to sort here
          - id: fix-byte-order-marker
          # - id: forbid-new-submodules # Disable me if you want submodules
          # - id: forbid-submodules # Disable me if you want submodules
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: name-tests-test
            args: [--unittest] # test.*\.py
          - id: no-commit-to-branch
            args: [--branch, main]
          - id: pretty-format-json
            args: [--autofix, --indent=4, --no-ensure-ascii, --no-sort-keys]
          - id: requirements-txt-fixer
          #       - id: sort-simple-yaml      # Disabled as a sensible default
          #         files: []                 # Add files to to sort here
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.21
      hooks:
          - id: ruff-check # Runs the linter
            types_or: [python, pyi, jupyter, pyproject]
            args: [--fix] # Automatically fixes linting errrors, see https://docs.astral.sh/ruff/rules/
          - id: ruff-format
            types_or: [python, pyi, jupyter] # Runs the formatter

    - repo: https://github.com/PyCQA/bandit
      rev: 1.9.4
      hooks:
          - id: bandit
            types: [python]
            require_serial: true
            args: [--exclude, "tests,build"]

    - repo: local
      hooks:
          - id: prettier
            name: Prettier (locally installed)
            entry: prettier --write --ignore-unknown --end-of-line lf --insert-pragma false --trailing-comma es5 --tab-width 4 --use-tabs false --print-width 80
            language: system
            types_or:
                [
                    javascript,
                    jsx,
                    ts,
                    tsx,
                    css,
                    less,
                    scss,
                    html,
                    json,
                    markdown,
                    yaml,
                ]
            pass_filenames: true
