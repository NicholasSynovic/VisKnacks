# Compose stack for the two SciVisAgent MCP servers.
#
#   docker compose up pvpython-renderer     # renderer only (no GPU needed)
#   docker compose --profile gpu up         # both, requires an NVIDIA GPU
#
# The renderer is the server wired into opencode.json.template. The rag
# service sits behind the `gpu` profile so that a plain `docker compose up`
# does not fail on a host without an NVIDIA GPU.

services:
    pvpython-renderer:
        build:
            context: ./pvpython-renderer
        image: pvpython-renderer:latest
        container_name: pvpython-renderer
        ports:
            - "8080:8080"
        volumes:
            # Main server log plus per-call runner/pvserver logs.
            - paraview-logs:/home/pvuser/paraview_logs
        restart: unless-stopped

    pvpython-rag:
        build:
            context: ./pvpython-rag
        image: pvpython-rag:latest
        container_name: pvpython-rag
        # Requires the NVIDIA Container Toolkit: rag_mcp.py hardcodes
        # device="cuda" with no CPU fallback and will exit at startup
        # without a GPU.
        profiles:
            - gpu
        ports:
            - "8081:8081"
        volumes:
            # Prebuilt FAISS indexes. Build them on the host first with
            # `make create-vector-databases` in pvpython-rag/; the container
            # is serve-only and never writes here.
            - ./pvpython-rag/data/vector-db:/data:ro
            # Cache for the nomic-ai/CodeRankEmbed weights, downloaded on
            # first start. Persisting this avoids re-downloading every run.
            - hf-cache:/cache/huggingface
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        restart: unless-stopped

volumes:
    paraview-logs:
    hf-cache:
