# Conda environment providing the ParaView runtime INSIDE THE CONTAINER.
#
# This is deliberately separate from `environment.yaml` (the host/dev env):
#
#   - `environment.yaml` pins the **Qt** build
#     (paraview=5.13.3=py310h494b928_110_qt), which links Qt and expects an
#     X display. That is correct for a workstation but wrong for a headless
#     container.
#   - This file pins the **osmesa** build, which renders OpenGL purely in
#     software (Mesa llvmpipe) with no X server, no GPU, and no driver on the
#     host. `pvserver`/`pvpython` therefore run in a bare container.
#
# Trade-offs of the osmesa build:
#   - Rendering is CPU-only, so large datasets render slower than on the Qt
#     or egl builds. For GPU-accelerated headless rendering, switch to an
#     `_egl` build and run the container with `--gpus all`.
#   - conda-forge's osmesa variants for 5.13.3 stop at **build number 8**,
#     while the qt variants reach 110. The build strings differ for that
#     reason; this is not a version mismatch. Both are ParaView 5.13.3.
#
# Keep the ParaView *version* here in sync with `environment.yaml` when
# bumping. `make freeze` regenerates `environment.yaml` only and will not
# touch this file.
name: pvpython_renderer
channels:
    - conda-forge
    - nodefaults
dependencies:
    - paraview=5.13.3=py310hae738ef_8_osmesa
